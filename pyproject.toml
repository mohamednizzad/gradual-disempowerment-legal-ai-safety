[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradual-disempowerment-legal-ai-safety"
version = "0.1.0"
description = "Exploratory metrics for a proposed AI safety pilot in AI-assisted legal reasoning"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
